<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Road Education</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>
  <div id="hud">
    <div id="puntaje">Puntaje: <span id="puntajeValor">0</span></div>
    <div id="vidas">Vidas: <span id="vidasValor">3</span></div>
    <button id="btnSalir">Salir</button>
  </div>

  <div id="juegoContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div id="pantallaVictoria" class="oculto">
      <div class="panelVictoria">
        <div class="tituloVictoria">¡Recorrido completado!</div>
        <p class="subtituloVictoria">Cruzaste los 3 niveles de Road Education.</p>
        <div class="puntajeFinal">Puntaje final: <span id="puntajeFinalValor">0</span></div>
        <div class="botonesVictoria">
          <button id="btnJugarDeNuevo">Jugar de nuevo</button>
          <button id="btnSalirVictoria">Salir</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/game.js"></script>
</body>
</html>
